name: Model and Router Benchmark CI

on:
  pull_request:
    paths:
      - "Agents/Model-And-Router-Benchmark/**"
      - "Agents/AOAI-Model-Migration-Benchmark/README*.md"
      - "Agents/README.md"
      - ".github/workflows/model-and-router-benchmark-ci.yml"
  push:
    branches:
      - master
    paths:
      - "Agents/Model-And-Router-Benchmark/**"
      - "Agents/AOAI-Model-Migration-Benchmark/README*.md"
      - "Agents/README.md"
      - ".github/workflows/model-and-router-benchmark-ci.yml"

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Restore project LFS objects
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="Agents/Model-And-Router-Benchmark/**"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Agents/Model-And-Router-Benchmark/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r Agents/Model-And-Router-Benchmark/requirements.txt

      - name: Run the fail-closed repository gate
        working-directory: Agents/Model-And-Router-Benchmark
        run: python scripts/validate_repo.py

      - name: Reject generated-file drift
        run: git diff --exit-code -- Agents/Model-And-Router-Benchmark
